name: nuget-cache
on: push
permissions:
  contents: write
jobs:
  cache:
    if: "!contains(github.event.head_commit.message, 'nuget feed')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: restore
        run: |
          set -x
          export NUGET_PACKAGES=$PWD/pk
          mkdir w && cd w
          cat > a.csproj <<'X'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="System.Device.Gpio" Version="*" />
              <PackageReference Include="Microsoft.Extensions.TimeProvider.Testing" Version="10.*" />
              <PackageReference Include="Microsoft.Extensions.Hosting" Version="10.*" />
              <PackageReference Include="Microsoft.Extensions.Hosting.Systemd" Version="10.*" />
              <PackageReference Include="Microsoft.Extensions.Hosting.WindowsServices" Version="10.*" />
              <PackageReference Include="Avalonia.Headless.XUnit" Version="*" />
            </ItemGroup>
          </Project>
          X
          dotnet restore
          for r in linux-x64 linux-arm64 win-x64; do dotnet restore -r $r || true; done
          dotnet --info > ../dotnet-info.txt
      - name: feed
        run: |
          mkdir feed
          find pk -name '*.nupkg' -exec cp {} feed/ \;
          ls feed > feed-liste.txt; du -sh feed
          tar cf - feed | split -b 90m - feed3.tar.
          git config user.name ci; git config user.email ci@example.invalid
          git add feed3.tar.* feed-liste.txt dotnet-info.txt
          git commit -m "nuget feed 3"
          git push
